<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Everyday Job & Invoice Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  
  <!-- Link to your clean, external styles and logic engines -->
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>

  <div x-data="appState" class="shell" x-cloak>
    <header>
      <div>
        <h1>Everyday Job & Invoice Manager</h1>
        <p>JR ENGINEERING CORE</p>
      </div>
      <div class="status-box">
        <span class="dot" :class="loading ? 'syncing' : ''"></span>
      </div>
    </header>

    <div class="banner" x-show="loading">Communicating with secure workbook data layers...</div>

    <main>
      <div x-show="feedback.text" :class="feedback.isError ? 'alert alert-error' : 'alert alert-success'" x-text="feedback.text"></div>

      <!-- VIEW 1: TIME TRACKER LOGS -->
      <div x-show="currentTab === 'tracker'">
        <section>
          <div class="card-title">Log Service Event</div>
          
          <div class="form-group">
            <label>Client Account</label>
            <select x-model="form.clientName">
              <option value="">-- Choose Account --</option>
              <template x-for="client in clients">
                <option :value="client.name" x-text="client.name"></option>
              </template>
            </select>
          </div>

          <div class="form-group">
            <label>Date</label>
            <input type="date" x-model="form.date" @change="syncOvernight">
          </div>

          <div class="form-group">
            <label>Scope of Work / Job Details</label>
            <textarea x-model="form.jobDetails" rows="2" placeholder="Describe tactical service delivery..."></textarea>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>Start</label>
              <input type="time" x-model="form.start" @change="syncOvernight" @input="syncOvernight" step="60">
            </div>
            <div class="form-group">
              <label>Finish</label>
              <input type="time" x-model="form.finish" @change="syncOvernight" @input="syncOvernight" step="60">
            </div>
          </div>
          <p class="shift-note" x-show="overnight" x-text="overnightLabel"></p>

          <div class="form-group">
            <label>Break Deduct</label>
            <select x-model="form.lunch">
              <option value="na">None</option>
              <option value="half hour">30 mins</option>
              <option value="hour">1 hr</option>
              <option value="hour and half">1.5 hrs</option>
              <option value="two hours">2 hrs</option>
            </select>
          </div>

          <button @click="submitForm">Commit Event to Spreadsheet</button>
        </section>
      </div>

      <!-- VIEW 2: BILLING ENGINE CORE -->
      <div x-show="currentTab === 'invoicer'">
        <section>
          <div class="card-title">Billing & Invoice Generator</div>
          
          <div class="form-group">
            <label>Select Target Account</label>
            <select x-model="invoiceForm.clientName" @change="loadUnbilledEntries">
              <option value="">-- Choose Account --</option>
              <template x-for="client in clients">
                <option :value="client.name" x-text="client.name"></option>
              </template>
            </select>
          </div>

          <div class="grid-2">
            <div class="metric-box">
              <span class="metric-title">Unbilled Base</span>
              <p x-text="unbilledData.totalHours"></p>
            </div>
            <div class="metric-box alt">
              <span class="metric-title" style="color:#6366f1">Accrued Due</span>
              <p x-text="unbilledData.totalAmount"></p>
            </div>
          </div>

          <button class="btn-alt" @click="processInvoice">Compile Account Statement & Invoice</button>
        </section>
      </div>
    </main>

    <nav>
      <button @click="setTrackerTab">🕒 Activity Log</button>
      <button @click="setInvoicerTab">📄 Billing Portal</button>
    </nav>
  </div>

</body>
</html>
